#開資料庫 -> 自動建表 -> 啟動網站
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    #連線前確認
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./DB:/db:ro
      - ./docker/db-init.sh:/db-init.sh:ro
    entrypoint: [ "bash", "/db-init.sh" ]
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    environment:
      ConnectionStrings__Default: "Server=db;Database=FPPR;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "8080:80"
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  mssql-data:
